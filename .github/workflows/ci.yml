name: ci
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Tests drive the real CLIs (fixtures come from their output), pinned to the versions verified locally.
      - run: npm i -g @fission-ai/openspec@1.12.0
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@v1.0.7
      - run: npm test
      - run: npx playwright test --version && npm run build
      - run: xvfb-run -a npx playwright test
        if: runner.os == 'Linux'
      - run: npx playwright test
        if: runner.os == 'Windows'
      - run: npx electron-builder ${{ runner.os == 'Linux' && '--linux' || '--win' }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
